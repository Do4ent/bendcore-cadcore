name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
    
    - name: Show compiler versions
      run: |
        g++ --version
        cmake --version
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure CMake
      run: |
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        echo "CMake configuration completed"
    
    - name: Check CMakeFiles
      run: |
        ls -la build/CMakeFiles/
        ls -la build/Makefile || echo "Makefile not found"
    
    - name: Build with verbose output
      run: |
        cd build
        make -j2 VERBOSE=1 2>&1 | tail -100
      continue-on-error: true
    
    - name: Check if executable exists
      run: |
        if [ -f build/bendcore_app ]; then
          echo "✅ bendcore_app successfully built"
          ls -lh build/bendcore_app
        else
          echo "❌ bendcore_app not found"
          ls -la build/
        fi
    
    - name: Run tests
      if: success()
      run: |
        cd build
        ctest --output-on-failure -j2
      continue-on-error: true
    
    - name: Upload Linux Executable
      if: hashFiles('build/bendcore_app') != ''
      uses: actions/upload-artifact@v4
      with:
        name: bendcore_app-linux
        path: build/bendcore_app
        retention-days: 30
