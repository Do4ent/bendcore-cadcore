name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
    
    - name: Show compiler versions
      run: |
        echo "GCC version:"
        gcc --version
        echo "G++ version:"
        g++ --version
        echo "CMake version:"
        cmake --version
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure CMake
      run: |
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
      continue-on-error: false
    
    - name: Check executable
      run: |
        if [ -f build/bendcore_app ]; then
          echo "✅ bendcore_app successfully created"
          file build/bendcore_app
          ls -lh build/bendcore_app
        else
          echo "❌ bendcore_app not found!"
          exit 1
        fi
    
    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure -j2 || true
      continue-on-error: true
    
    - name: Upload Linux Executable
      uses: actions/upload-artifact@v4
      with:
        name: bendcore_app-linux
        path: build/bendcore_app
        retention-days: 30
        if-no-files-found: error
