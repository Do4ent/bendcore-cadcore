name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup CMake
      uses: lukka/get-cmake@latest
    
    - name: Configure CMake
      run: |
        mkdir build-windows
        cd build-windows
        cmake -G "Visual Studio 17 2022" -A x64 ..
    
    - name: Build Release
      run: |
        cd build-windows
        cmake --build . --config Release -j 4
    
    - name: Run Tests
      run: |
        cd build-windows
        ctest -C Release --output-on-failure -j 4
    
    - name: Upload Windows Executable
      uses: actions/upload-artifact@v4
      with:
        name: bendcore_app-windows
        path: build-windows/Release/bendcore_app.exe
        retention-days: 30
    
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build-windows/Release/bendcore_app.exe
          bendcore-windows-build.bat
          RUN_ON_WINDOWS.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
