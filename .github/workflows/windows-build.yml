name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup CMake and Ninja
      run: |
        choco install cmake ninja -y
        cmake --version
        ninja --version
    
    - name: Configure CMake
      run: |
        mkdir build-windows
        cd build-windows
        cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release ..
        if errorlevel 1 (
          echo CMake configuration failed!
          exit /b 1
        )
    
    - name: Build Release
      run: |
        cd build-windows
        cmake --build . --config Release -j 4
        if errorlevel 1 (
          echo Build failed!
          exit /b 1
        )
    
    - name: Run Tests
      run: |
        cd build-windows
        ctest -C Release --output-on-failure -j 4
    
    - name: Upload Windows Executable
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: bendcore_app-windows
        path: build-windows/bendcore_app.exe
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/') && success()
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build-windows/bendcore_app.exe
          bendcore-windows-build.bat
          RUN_ON_WINDOWS.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
