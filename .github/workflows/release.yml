name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get release notes and version
        id: release_info
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=$TAG" >> $GITHUB_OUTPUT

          # Generate comprehensive release notes
          if git describe --tags --abbrev=0 HEAD^ >/dev/null 2>&1; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^)
            NOTES=$(git log $PREV_TAG..HEAD --pretty=format:"- %h: %s (%an)")
          else
            NOTES=$(git log --pretty=format:"- %h: %s (%an)" | head -20)
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "## Changes since last release" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ build-essential

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel $(nproc)

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure --parallel $(nproc)

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp build/bendcore_app release-assets/bendcore_app-linux-x64
          ls -lh build/test_* | awk '{print $NF}' | head -10 | xargs -I {} cp {} release-assets/
          chmod +x release-assets/*

      - name: Create Release with Assets
        run: |
          gh release create ${{ steps.release_info.outputs.version }} \
            release-assets/* \
            --title "Release ${{ steps.release_info.outputs.version }}" \
            --notes "${{ steps.release_info.outputs.notes }}" \
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
